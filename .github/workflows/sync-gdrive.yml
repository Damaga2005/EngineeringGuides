name: Sync Guides from Google Drive

on:
  schedule:
    # Runs every day at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      gdrive_folder_id:
        description: 'Google Drive Folder ID (optional override)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sync Dependencies
        run: |
          pip install requests google-api-python-client google-auth

      - name: Run Google Drive Sync Script
        env:
          GDRIVE_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id || secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
        run: |
          python scripts/sync_gdrive.py

      - name: Commit and Push New Guides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Engineering guides/"
          if git diff --staged --quiet; then
            echo "No new guides detected from Google Drive."
          else
            git commit -m "chore(sync): automated sync of new engineering guides from Google Drive"
            git push origin main
            echo "New guides successfully committed and pushed to main."
          fi
