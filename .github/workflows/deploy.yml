name: Deploy EngineeringGuides Portal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'Engineering guides/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
  workflow_dispatch:
  schedule:
    # Sincronización automática periódica (cada 6 horas)
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies (PyMuPDF)
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Auto-Extract Guides, Render Schematics & Build Portal
        run: |
          python scripts/extract_official_and_build_manuals.py
          npx vite build
          node scripts/copy_guides.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
